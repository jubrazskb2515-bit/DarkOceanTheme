apply plugin: 'com.android.application'

android {
    namespace 'com.custom.infinix.theme'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.infinix.theme"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
